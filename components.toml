# The component commits Fantasy Engine is built from (PLAN.md decision 12).
#
# Each table names a component by the folder it takes in the workspace, the
# repository it comes from and the full commit the release uses.  The build
# takes each component's tree at exactly that commit, so a checkout's
# uncommitted changes and its current branch never reach a build.  Moving a
# component forward is a one-line change here, made once the new
# combination has passed its checks; this file's history records which
# combination passed which.

